# kernel-install settings for Omadora's Limine boot (installed as
# /etc/kernel/install.conf).
#
# limine-entry-tool keeps its kernel copies in <ESP>/<machine-id>/, and without
# a layout kernel-install reads that directory as a Boot Loader Specification
# layout on the ESP: new kernels then skip /boot, where Limine's image rebuilds
# look for them, and land on the ESP as copies nothing boots. Pin Fedora's own
# /boot layout; install.d/96-limine.install registers each kernel with Limine.
layout=other
BOOT_ROOT=/boot
