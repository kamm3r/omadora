# Base dracut configuration for Omadora on Fedora.
#
# Replaces the Arch mkinitcpio HOOKS list from
# etc/mkinitcpio.conf.d/omarchy_hooks.conf (kept in tree as reference):
# plymouth bootsplash, btrfs root support, and systemd-based initramfs are
# dracut defaults when the host uses them; what needed explicit hooks on
# mkinitcpio (encrypt, lvm, mdraid) is auto-included by dracut's hostonly
# detection, so only the always-needed extras are forced here.

# Plymouth bootsplash in the initramfs (LUKS prompt theming).
add_dracutmodules+=" plymouth "

# Btrfs root with snapper snapshots and swapfile resume support.
filesystems+=" btrfs "

# Keyboard layout for the LUKS prompt follows the console default.
i18n_vars+=" /etc/vconsole.conf "
